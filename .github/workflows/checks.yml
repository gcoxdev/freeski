name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-assets.txt
      - run: npm run lint
      - run: npm test
      - run: npm run assets:check
      - run: npm run audit:clean-room
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Set up virtual audio output
        # Firefox needs an audio server to resume Web Audio on headless Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=freeski_ci
          pactl set-default-sink freeski_ci
          pactl info
          pactl list short sinks
      - run: npm run test:e2e:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
